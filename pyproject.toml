[project]
name = "cli-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=0.2.0",
    "langchain-community>=0.4.1",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "pandas>=3.0.1",
    "pyfiglet>=1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
]
[project.scripts]
dir-ai = "dir_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dir_ai"]
