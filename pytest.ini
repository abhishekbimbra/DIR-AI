[pytest]
testpaths = tests
addopts = --disable-socket --allow-unix-socket -m "not live"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: requires real provider credentials and network access
    enable_socket: opt out of socket blocking for localhost e2e tests
filterwarnings =
    error::DeprecationWarning:dir_ai.*
